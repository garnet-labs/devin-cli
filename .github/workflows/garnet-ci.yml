name: Garnet Runtime Visibility

# Builds the npm packages without publishing, under the Garnet sensor, so the
# pull request carries a head-bound record of what the build actually did at
# runtime: every outbound connection with its execution chain and GitHub step.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: garnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Garnet Runtime Visibility
        uses: garnet-org/action@96e9f81ec0f59f2322e8c67b43c4d4017d932ad3 # v2.4.1
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packages from the release manifest (no publish)
        run: python3 scripts/publish_npm.py --no-publish --out dist
